<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeaPASS 英語力診断テスト</title>
<style>
  :root{
    --navy:#1f3c63;
    --navy-light:#2e5a8f;
    --orange:#f08a3c;
    --sky-top:#aee1f7;
    --sky-bottom:#fbe4e6;
    --card-bg:#ffffff;
    --text-main:#2c3e50;
    --text-sub:#7c8b9b;
    --border:#e3edf5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:linear-gradient(160deg, var(--sky-top) 0%, #d8eefb 35%, var(--sky-bottom) 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:24px 12px;
    color:var(--text-main);
  }
  .app{
    width:100%;
    max-width:640px;
  }
  .header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:18px;
  }
  .logo-badge{
    width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff 0%, #cfeaf8 55%, #f7d9de 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(31,60,99,0.15);
  }
  .logo-text{
    font-size:22px;font-weight:800;color:var(--navy);
    letter-spacing:0.5px;
  }
  .logo-text span{color:var(--orange);}
  .card{
    background:var(--card-bg);
    border-radius:22px;
    box-shadow:0 8px 30px rgba(31,60,99,0.12);
    padding:32px 28px;
    min-height:380px;
    display:flex;
    flex-direction:column;
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .progress-bar{
    flex:1;height:8px;border-radius:4px;background:var(--border);overflow:hidden;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg, var(--navy-light), var(--orange));
    border-radius:4px;transition:width 0.3s ease;
  }
  .progress-label{
    font-size:12px;color:var(--text-sub);white-space:nowrap;font-weight:600;
  }
  .section-tag{
    display:inline-block;
    font-size:11px;font-weight:700;
    color:var(--navy-light);
    background:#eaf4fc;
    border-radius:20px;
    padding:4px 12px;
    margin-bottom:10px;
    letter-spacing:0.5px;
  }
  h1{
    font-size:24px;color:var(--navy);margin:0 0 12px;font-weight:800;
  }
  h2{
    font-size:19px;color:var(--navy);margin:0 0 18px;line-height:1.5;font-weight:700;
  }
  .reading-box{
    background:#f4f9fd;border:1px solid var(--border);
    border-radius:12px;padding:14px 16px;margin-bottom:16px;
    font-size:14px;line-height:1.7;color:var(--text-main);
  }
  .options{
    display:flex;flex-direction:column;gap:10px;flex:1;
  }
  .option-btn{
    text-align:left;
    border:2px solid var(--border);
    background:#fff;
    border-radius:14px;
    padding:14px 16px;
    font-size:14.5px;
    color:var(--text-main);
    cursor:pointer;
    transition:all 0.15s ease;
    line-height:1.5;
  }
  .option-btn:hover{
    border-color:var(--navy-light);
    background:#f7fbfe;
  }
  .option-btn.selected{
    border-color:var(--orange);
    background:#fff6ee;
    font-weight:700;
    color:var(--navy);
  }
  .option-letter{
    display:inline-flex;
    align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:50%;
    background:var(--navy);color:#fff;font-size:12px;font-weight:700;
    margin-right:10px;flex-shrink:0;
  }
  .option-btn.selected .option-letter{
    background:var(--orange);
  }
  .nav-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:24px;gap:10px;
  }
  .btn{
    border:none;border-radius:30px;
    padding:13px 28px;font-size:14.5px;font-weight:700;
    cursor:pointer;transition:all 0.15s ease;
  }
  .btn-primary{
    background:linear-gradient(90deg, var(--navy), var(--navy-light));
    color:#fff;box-shadow:0 4px 12px rgba(31,60,99,0.25);
  }
  .btn-primary:disabled{
    background:#cfd8e3;color:#fff;box-shadow:none;cursor:not-allowed;
  }
  .btn-primary:hover:not(:disabled){
    transform:translateY(-1px);box-shadow:0 6px 16px rgba(31,60,99,0.3);
  }
  .btn-ghost{
    background:transparent;color:var(--text-sub);border:2px solid var(--border);
  }
  .btn-ghost:hover{color:var(--navy);border-color:var(--navy-light);}
  .btn-wide{width:100%;}
  .start-illust{
    display:flex;justify-content:center;margin:12px 0 28px;
  }
  .start-illust svg{
    width:180px;height:auto;color:var(--navy);
    stroke:var(--navy);
  }
  .start-illust svg .accent{
    stroke:var(--orange);fill:var(--orange);
  }
  /* line-drawing illustration icons */
  .ico{
    display:inline-flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .ico svg{
    stroke:var(--navy);fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .ico svg .accent{fill:var(--orange);stroke:none;}
  .ico-sm svg{width:20px;height:20px;}
  .ico-md svg{width:30px;height:30px;}
  .ico-lg svg{width:60px;height:60px;stroke-width:2;}
  /* Result styles */
  .result-hero{
    text-align:center;margin-bottom:8px;
  }
  .result-character-icon{margin-bottom:6px;display:flex;justify-content:center;}
  .result-character-name{
    font-size:21px;font-weight:800;color:var(--navy);margin:6px 0 4px;
  }
  .result-character-desc{
    font-size:13.5px;color:var(--text-sub);line-height:1.7;margin-bottom:18px;
  }
  .score-card{
    background:linear-gradient(135deg, #1f3c63, #2e5a8f);
    color:#fff;border-radius:18px;padding:22px;margin-bottom:18px;
    display:flex;justify-content:space-around;align-items:center;text-align:center;
  }
  .score-block .score-label{font-size:12px;opacity:0.8;margin-bottom:6px;}
  .score-block .score-value{font-size:34px;font-weight:800;}
  .score-block .score-unit{font-size:12px;opacity:0.8;}
  .score-arrow{font-size:22px;opacity:0.6;}
  .result-section{
    margin-bottom:18px;
  }
  .result-section h3{
    font-size:15px;color:var(--navy);margin:0 0 8px;
    display:flex;align-items:center;gap:8px;font-weight:800;
  }
  .result-section .badge{
    background:#eaf4fc;color:var(--navy-light);font-size:11px;font-weight:700;
    border-radius:20px;padding:3px 10px;
  }
  .result-section .content-box{
    background:#f9fbfd;border:1px solid var(--border);border-radius:12px;
    padding:13px 15px;font-size:13.5px;line-height:1.8;color:var(--text-main);
  }
  .material-list{margin:0;padding-left:18px;}
  .material-list li{margin-bottom:4px;}
  .leapass-box{
    background:linear-gradient(135deg,#fff6ee,#fef0e8);
    border:1px solid #fbd9bc;border-radius:12px;padding:14px 15px;
    font-size:13.5px;line-height:1.8;color:var(--navy);
  }
  .leapass-box b{color:var(--orange);}
  .footer-note{
    text-align:center;font-size:11px;color:var(--text-sub);margin-top:10px;
  }
  @media (max-width:480px){
    .card{padding:24px 18px;}
    .score-card{flex-direction:row;padding:18px 12px;}
    .score-block .score-value{font-size:26px;}
  }
</style>
</head>

  "S-C-G": { icon:"cloud", name:"じっくり育成型タイプ", desc:"無理せず少しずつ前進したいタイプ。学習習慣そのものをこれから作っていくフェーズなので、伴走してくれる存在があると安心して続けられます。" },
  "S-E-A": { icon:"bookOpen", name:"効率派の自己成長タイプ", desc:"自分で学習を進められる力があり、効率も重視するタイプ。あとは「正しい教材選び」と「優先順位」を整えるだけで、着実にスコアが伸びていきます。" },
  "S-E-G": { icon:"target", name:"計画的な目標達成タイプ", desc:"目標達成のために最短ルートを知りたいタイプ。学習の進め方に迷いやすいので、最初にしっかりした学習計画を立てることが成功への近道です。" },
};

/* ===================== SHEET CONNECTION ===================== */
// Google Apps Script Web App のURLをここに設定すると、診断完了時に結果が
// Googleスプレッドシートへ自動送信されます。未設定（空文字）の場合は送信されません。
const GAS_URL = "";

function sendResultToSheet(payload){
  if(!GAS_URL) return;
  try{
    fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    }).catch(()=>{});
  }catch(e){}
}

/* ===================== STATE ===================== */
const profileAnswers = new Array(profileQuestions.length).fill(null);
const quizAnswers = new Array(quizQuestions.length).fill(null);

const TOTAL_STEPS = 1 + profileQuestions.length + quizQuestions.length + 1; // start + profile + quiz + result
let step = 0;

const card = document.getElementById("card");

/* ===================== HELPERS ===================== */
function progressHTML(currentIndex, totalIndex, label){
  const pct = Math.round((currentIndex / totalIndex) * 100);
  return `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${label}</div>
    </div>
  `;
}

function letters(i){ return ["A","B","C","D","E","F"][i]; }

/* ===================== RENDER ===================== */
function render(){
  if(step === 0){
    renderStart();
  } else if(step >= 1 && step <= profileQuestions.length){
    renderProfile(step - 1);
  } else if(step > profileQuestions.length && step <= profileQuestions.length + quizQuestions.length){
    renderQuiz(step - profileQuestions.length - 1);
  } else {
    renderResult();
  }
}

function renderStart(){
  card.innerHTML = `
    <div class="start-illust">${startIllustration}</div>
    <h1 style="text-align:center;">英語力診断テスト</h1>
    <div class="nav-row" style="margin-top:auto;">
      <button class="btn btn-primary btn-wide" id="startBtn">診断をはじめる</button>
    </div>
  `;
  document.getElementById("startBtn").onclick = () => { step = 1; render(); };
}

function renderProfile(idx){
  const q = profileQuestions[idx];
  const selected = profileAnswers[idx];
  card.innerHTML = `
    ${progressHTML(idx+1, profileQuestions.length, `プロフィール ${idx+1} / ${profileQuestions.length}`)}
    <div class="section-tag">${q.section}</div>
    <h2>${q.q}</h2>
    <div class="options">
      ${q.options.map((opt,i)=>`
        <button class="option-btn ${selected===i?'selected':''}" data-i="${i}">
          <span class="option-letter">${letters(i)}</span>${opt}
        </button>`).join("")}
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" id="backBtn" ${idx===0?'style="visibility:hidden;"':''}>戻る</button>
      <button class="btn btn-primary" id="nextBtn" ${selected===null?'disabled':''}>次へ</button>
    </div>
  `;
  card.querySelectorAll(".option-btn").forEach(btn=>{
    btn.onclick = ()=>{
      profileAnswers[idx] = parseInt(btn.dataset.i);
      renderProfile(idx);
    };
  });
  document.getElementById("backBtn").onclick = ()=>{ step--; render(); };
  document.getElementById("nextBtn").onclick = ()=>{ step++; render(); };
}

function renderQuiz(idx){
  const q = quizQuestions[idx];
  const selected = quizAnswers[idx];
  card.innerHTML = `
    ${progressHTML(idx+1, quizQuestions.length, `問題 ${idx+1} / ${quizQuestions.length}`)}
    <div class="section-tag">TOEIC形式問題</div>
    ${q.reading ? `<div class="reading-box">${q.reading.replace(/\n/g,"<br>")}</div>` : ""}
    <h2>${q.q}</h2>
    <div class="options">
      ${q.options.map((opt,i)=>`
        <button class="option-btn ${selected===i?'selected':''}" data-i="${i}">
          <span class="option-letter">${letters(i)}</span>${opt}
        </button>`).join("")}
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" id="backBtn">戻る</button>
      <button class="btn btn-primary" id="nextBtn" ${selected===null?'disabled':''}>${idx===quizQuestions.length-1?'結果を見る':'次へ'}</button>
    </div>
  `;
  card.querySelectorAll(".option-btn").forEach(btn=>{
    btn.onclick = ()=>{
      quizAnswers[idx] = parseInt(btn.dataset.i);
      renderQuiz(idx);
    };
  });
  document.getElementById("backBtn").onclick = ()=>{ step--; render(); };
  document.getElementById("nextBtn").onclick = ()=>{ step++; render(); };
}

/* ===================== SCORING / LOGIC ===================== */
function calcEstimatedScore(){
  let points = 0;
  let maxPoints = 0;
  quizQuestions.forEach((q, i)=>{
    maxPoints += q.diff;
    if(quizAnswers[i] === q.answer) points += q.diff;
  });
  let raw = 10 + (points / maxPoints) * 980;
  let score = Math.round(raw / 5) * 5;
  if(score < 10) score = 10;
  if(score > 990) score = 990;
  return score;
}

function calcCharacter(){
  // Axis A: 目的 (profileAnswers[4]) -> P (実践派) / S (試験派)
  const purpose = profileAnswers[4];
  const axisA = (purpose === 0 || purpose === 1 || purpose === 2) ? "P" : "S";

  // Axis B: 悩み (profileAnswers[6]) -> C (継続サポート型) / E (効率重視型)
  const worry = profileAnswers[6];
  const axisB = (worry === 0 || worry === 3 || worry === 4) ? "C" : "E";

  // Axis C: 学習時間 (profileAnswers[3]) -> A (自走型) / G (サポート型)
  const studyTime = profileAnswers[3];
  const axisC = (studyTime === 3 || studyTime === 4) ? "A" : "G";

  const key = `${axisA}-${axisB}-${axisC}`;
  return { key, ...characterTypes[key] };
}

function calcTargetScore(currentScore){
  const toeicPurpose = profileAnswers[5];
  const targets = [730, 730, 860, 600, null];
  let target = targets[toeicPurpose];
  if(target === null){
    target = Math.min(990, Math.max(600, currentScore + 150));
    target = Math.round(target / 10) * 10;
  }
  if(target <= currentScore){
    target = Math.min(990, Math.ceil((currentScore + 50) / 10) * 10);
  }
  return target;
}

function calcStudyPlan(currentScore, targetScore){
  const gap = targetScore - currentScore;
  const studyTime = profileAnswers[3]; // 0-4, higher = more time

  let level, methods, materials;

  if(gap <= 50){
    level = "維持・スコア定着レベル";
    methods = [
      "公式問題集や模試形式の演習で、時間配分と感覚を維持する",
      "英字ニュースやビジネス英語のリスニング・リーディングを日常に取り入れる",
      "間違えた問題は『なぜ間違えたか』を振り返りノートに残す",
    ];
    materials = [
      "TOEIC L&Rテスト 公式問題集（最新版）",
      "TOEIC L&Rテスト 模試特急シリーズ",
      "English Journal（リスニング素材）",
    ];
  } else if(gap <= 150){
    level = "中級ブラッシュアップレベル";
    methods = [
      "頻出文法・語彙の総復習で『取りこぼし』を減らす",
      "Part5・6の文法問題を毎日10〜15問、時間を計って解く",
      "公式問題集を1冊やり込み、リスニングはシャドーイングで定着させる",
    ];
    materials = [
      "TOEIC L&Rテスト 文法問題でる1000問（TEX加藤）",
      "金のフレーズ（TOEIC L&Rテスト 出る単特急）",
      "TOEIC L&Rテスト 公式問題集",
    ];
  } else if(gap <= 300){
    level = "基礎強化＋応用レベル";
    methods = [
      "基本文法を1冊で総整理し、語彙力を1日20語ペースで増やす",
      "リスニングは『聞く→スクリプト確認→音読』のサイクルを繰り返す",
      "週1回は時間を計って模試形式の演習を行い、本番の感覚をつかむ",
    ];
    materials = [
      "1駅1題 新TOEIC TEST 文法特急",
      "英単語ターゲット1200 / 金のフレーズ",
      "abceedなどのアプリでスキマ時間に演習",
    ];
  } else {
    level = "基礎固めスタートレベル";
    methods = [
      "中学・高校レベルの基本文法から1冊で総復習する",
      "基礎単語（1000〜1200語レベル）を毎日コツコツ覚える",
      "易しい教材から始めて『わかる楽しさ』を積み上げ、学習を習慣化する",
    ];
    materials = [
      "中学英文法を修了させる本（やり直し向け）",
      "英単語ターゲット1200",
      "スタディサプリENGLISH TOEIC対策コース（基礎講座）",
    ];
  }

  // study period based on gap and available study time
  let baseMonths;
  if(gap <= 50) baseMonths = 1;
  else if(gap <= 150) baseMonths = 2.5;
  else if(gap <= 300) baseMonths = 5;
  else baseMonths = 9;

  let multiplier = 1;
  if(studyTime === 0) multiplier = 1.8;
  else if(studyTime === 1) multiplier = 1.5;
  else if(studyTime === 2) multiplier = 1.2;
  else if(studyTime === 3) multiplier = 1.0;
  else multiplier = 0.85;

  const months = Math.max(1, Math.round(baseMonths * multiplier));
  const period = months <= 1 ? "約1ヶ月" : `約${months}ヶ月`;

  return { level, methods, materials, period };
}

function calcLeapassSupport(){
  const worry = profileAnswers[6];
  const future = profileAnswers[7];

  let worryMsg;
  switch(worry){
    case 0:
      worryMsg = "「継続できない」というお悩みには、<b>進捗管理＆コーチング機能</b>で学習リズムを一緒に作ります。毎週の振り返りやリマインドで、モチベーションが切れる前にサポートします。";
      break;
    case 1:
      worryMsg = "「何を勉強すればいいかわからない」というお悩みには、<b>あなた専用の学習カリキュラム設計</b>で、診断結果に基づいた最適な学習ステップを提示します。";
      break;
    case 2:
      worryMsg = "「勉強時間が確保できない」というお悩みには、<b>スキマ時間学習プラン</b>と優先順位の整理で、忙しい中でも結果につながる学習に集中できるようサポートします。";
      break;
    case 3:
      worryMsg = "「伸びを実感できない」というお悩みには、<b>定期的な実力測定とフィードバック</b>で、成長を可視化しながら学習の方向修正をサポートします。";
      break;
    default:
      worryMsg = "<b>あなた専用の学習カリキュラムと進捗管理</b>で、目標スコアまでの最短ルートを一緒に設計します。";
  }

  const futureMessages = [
    "「海外で働く・住む」という未来に向けて、ビジネスシーンで使える実践的な表現も学習プランに組み込めます。",
    "「外国人と自由に会話したい」という目標に向けて、スピーキング・アウトプット練習もカリキュラムに追加できます。",
    "「転職・キャリアアップ」を見据えて、スコアアップだけでなく面接や履歴書で使える英語力にもつなげます。",
    "「海外旅行をもっと楽しみたい」という目標に合わせて、実用的な英会話フレーズも一緒に学べます。",
    "「自分に自信を持ちたい」という想いに寄り添い、小さな達成を積み重ねられるよう学習設計をサポートします。",
  ];

  return `${worryMsg}<br><br>${futureMessages[future] ?? ""}`;
}

/* ===================== RESULT RENDER ===================== */
function renderResult(){
  const currentScore = calcEstimatedScore();
  const character = calcCharacter();
  const targetScore = calcTargetScore(currentScore);
  const plan = calcStudyPlan(currentScore, targetScore);
  const leapassMsg = calcLeapassSupport();

  const correctCount = quizQuestions.reduce((sum,q,i)=> sum + (quizAnswers[i]===q.answer ? 1 : 0), 0);
  sendResultToSheet({
    profile: profileQuestions.map((q,i)=> q.options[profileAnswers[i]]),
    score: currentScore,
    target: targetScore,
    character: character.name,
    correctCount: correctCount,
    quizResults: quizQuestions.map((q,i)=> quizAnswers[i]===q.answer),
  });

  card.innerHTML = `
    <div class="section-tag">診断結果</div>
    <div class="result-hero">
      <div class="result-character-icon">${icon(character.icon, "lg")}</div>
      <div class="result-character-name">${character.name}</div>
      <div class="result-character-desc">${character.desc}</div>
    </div>

    <div class="score-card">
      <div class="score-block">
        <div class="score-label">推定TOEICスコア</div>
        <div class="score-value">${currentScore}</div>
        <div class="score-unit">/ 990点</div>
      </div>
      <div class="score-arrow">→</div>
      <div class="score-block">
        <div class="score-label">目指すべきスコア</div>
        <div class="score-value">${targetScore}</div>
        <div class="score-unit">/ 990点</div>
      </div>
    </div>

    <div class="result-section">
      <h3>学習レベル <span class="badge">${plan.level}</span></h3>
    </div>

    <div class="result-section">
      <h3>${icon('books','md')}おすすめの勉強方法</h3>
      <div class="content-box">
        <ul class="material-list">
          ${plan.methods.map(m=>`<li>${m}</li>`).join("")}
        </ul>
      </div>
    </div>

    <div class="result-section">
      <h3>${icon('bookOpen','md')}おすすめ教材</h3>
      <div class="content-box">
        <ul class="material-list">
          ${plan.materials.map(m=>`<li>${m}</li>`).join("")}
        </ul>
      </div>
    </div>

    <div class="result-section">
      <h3>${icon('calendar','md')}目標達成までの勉強期間（目安）</h3>
      <div class="content-box">
        現在の学習スタイルから、目標スコア ${targetScore}点 まで <b>${plan.period}</b> が目安です。
      </div>
    </div>

    <div class="result-section">
      <h3>${icon('rocket','md')}LeaPASSで補えるところ</h3>
      <div class="leapass-box">${leapassMsg}</div>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="restartBtn">最初からやり直す</button>
    </div>
  `;

  document.getElementById("restartBtn").onclick = ()=>{
    profileAnswers.fill(null);
    quizAnswers.fill(null);
    step = 0;
    render();
  };
}

/* ===================== INIT ===================== */
render();
</script>
